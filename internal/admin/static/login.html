<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>Sign in — HGFW</title>
<link rel="stylesheet" href="/assets/style.css"></head>
<body class="login-page">
<main class="login-card" aria-labelledby="title">
<div class="brand"><span class="brand-mark" aria-hidden="true">H<span>G</span></span><div><strong>HGFW</strong><small>DEVICE CONTROL</small></div></div>
<p class="eyebrow">Secure access · Local controller</p>
<h1 id="title">Sign in to your device.</h1>
<p class="muted">Administration is restricted to authorized operators. This build is an engineering preview.</p>
<form method="post" action="/login">
<label for="password">Administrator password</label>
<input id="password" name="password" type="password" required minlength="12" autocomplete="current-password" autofocus>
<button type="submit" class="primary">Continue to dashboard <span aria-hidden="true">↗</span></button>
</form>
<div class="login-footer"><span class="signal-dot" aria-hidden="true"></span> Access protected by salted password verification and session authentication.</div>
</main>
</body>
</html>
