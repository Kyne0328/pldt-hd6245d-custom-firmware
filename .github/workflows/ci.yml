name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: false
      - name: Install ARM build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld make python3 qemu-user-static
      - name: Build, verify, and test the ARMv7 userspace
        run: make all
      - name: Inspect ARM output and non-flashable package markers
        run: |
          file build/hgfw-canary build/hgfw-armv7
          readelf -h build/hgfw-armv7 | grep 'Machine:.*ARM'
          go version -m build/hgfw-armv7 | grep -F 'GOARM=7,softfloat'
          qemu-arm-static -cpu cortex-a9,vfp=off build/hgfw-armv7 version
          qemu-arm-static -cpu cortex-a9,vfp=off build/hgfw-armv7 usb
          qemu-arm-static -cpu cortex-a9,vfp=off build/hgfw-armv7 network-inspect
          qemu-arm-static -cpu cortex-a9,vfp=off build/hgfw-armv7 wireless-inspect
          qemu-arm-static -cpu cortex-a9,vfp=off build/hgfw-armv7 vpn-inspect
          make host
          timeout 25s build/hgfw-host network-selftest | python3 -c "import json,sys; v=json.load(sys.stdin); assert all(v[k] for k in ('success','responseVerified','supervised','stopped'))"
          timeout 90s qemu-arm-static -cpu cortex-a9,vfp=off build/hgfw-armv7 smoke
          GOOS=linux GOARCH=arm GOARM=7,softfloat CGO_ENABLED=0 go test -c -o build/hgfw-preview-tests-arm ./internal/preview
          timeout 90s qemu-arm-static -cpu cortex-a9,vfp=off build/hgfw-preview-tests-arm
          python3 -c "import json; m=json.load(open('dist/manifest.json')); assert m['bootable'] is False and m['flashable'] is False"
